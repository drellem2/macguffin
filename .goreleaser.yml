version: 2

builds:
  - main: ./cmd/mg
    binary: mg
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.CommitDate}}
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64

archives:
  - formats: [binary]
    name_template: "mg_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: drellem2
    name: macguffin

homebrew_casks:
  - name: mg
    # Generate the cask but do NOT push it to drellem2/homebrew-tap (mg-b0f0a).
    # HOMEBREW_TAP_GITHUB_TOKEN returns 401, and a failed tap push turns the
    # release run red AFTER the GitHub release and its assets are already
    # published (v0.4.0). The cask is still written to
    # dist/homebrew/Casks/mg.rb, and release.yml uploads it as the
    # `homebrew-cask` workflow artifact so the tap can be updated by hand.
    # To flip back: rotate the token (mg-f940), then delete this line.
    skip_upload: true
    binaries:
      - mg
    repository:
      owner: drellem2
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    homepage: "https://github.com/drellem2/macguffin"
    description: "macguffin work-item tracker"
    # mg ships as an unsigned binary; strip the macOS quarantine bit on install
    # so Gatekeeper doesn't block it. (Casks are normally signed; this is the
    # documented goreleaser alternative for unsigned CLIs.)
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mg"]
          end
