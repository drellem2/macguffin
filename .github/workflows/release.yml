name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # The cask is generated but not pushed to the tap (skip_upload in
      # .goreleaser.yml, mg-b0f0a). Keep it as an artifact so the tap can be
      # updated by hand. No continue-on-error on the goreleaser step: a failed
      # GitHub release must still fail this run.
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-cask
          path: dist/homebrew/**
          if-no-files-found: error
