name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      # The $TMPDIR leak guard. It runs its own short `go test` slice with
      # $TMPDIR pinned and counts what the run leaves behind, so it cannot be
      # folded into the step above. It is here because a temp-dir leak has no
      # other detector: nothing on the host that filled up reported the disk at
      # all until an unrelated build died of Errno 28 (mg-cc3f).
      - run: sh scripts/test-tmpdir-leak.sh

  # The shell suites. These were previously run by nothing: test.sh covered only
  # `go test ./...` and test-shadow.sh, and scripts/test-install.sh was in no
  # runner at all — so its assertions could rot (and had) with nothing to notice.
  install:
    strategy:
      # Report both legs. Under the default fail-fast, one leg's failure cancels
      # the other mid-run, and a cancelled leg's state is unknown rather than
      # clean — on 31363989670 that is exactly what happened to ubuntu, so the
      # rate-limit failure could not be told apart from a macOS-only one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # install.sh asks the GitHub API for the latest release tag. That call is
    # rate-limited per SOURCE IP when unauthenticated (60/hour), and Actions
    # runners share a NAT pool with the rest of the platform — so the quota is
    # regularly spent by strangers and the call 403s with nothing wrong on our
    # side. Run 31363989670 died exactly there, on both legs of this matrix.
    # Authenticated, the request is metered against the token instead (5000/hr).
    # The default workflow token needs no secret and no permission beyond the
    # `contents: read` already granted above.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # test-install-guard.sh and test-install-auth.sh need no network;
      # test-install.sh downloads the latest release, which is why it is here
      # rather than in ./test.sh.
      - run: sh scripts/test-install-guard.sh
      - run: sh scripts/test-install-auth.sh
      - run: sh scripts/test-install.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
